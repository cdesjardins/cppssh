# west manifest for a standalone cppssh workspace.
#
# ComBomb/west.yml imports this file, so the paths below are the ones cppssh's
# CMakeLists.txt already expects relative to the source directory: ../include
# for the cmake modules, ../install for the staged libraries, and
# ../external/botan/install for Botan.
#
#   topdir/
#   |-- .west/
#   |-- cppssh/            this repo
#   |-- CDLogger/
#   |-- include/
#   |-- build/             makebotan.py and build.py
#   `-- external/botan/
manifest:
  version: "1.2"

  remotes:
    - name: github
      url-base: ssh://git@github.com/cdesjardins

  defaults:
    remote: github
    revision: master

  projects:
    - name: include
    - name: CDLogger
    - name: build
      west-commands: west-commands.yml
    # Pinned to a release tag rather than a branch, so a shallow clone is
    # enough. Drop clone-depth if you need the full history of the fork.
    - name: botan
      path: external/botan
      revision: 3.12.0
      clone-depth: 1

  self:
    path: cppssh
